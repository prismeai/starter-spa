# GitLab CI deploy template — adapt to your branch model.
#
# Set these in Settings → CI/CD → Variables (mark them MASKED + PROTECTED):
#   PRISMEAI_API_URL
#   PRISMEAI_ACCESS_TOKEN
#   PRISMEAI_WORKSPACE_ID

stages:
  - deploy

.deploy_template: &deploy_template
  image: node:20-alpine
  stage: deploy
  cache:
    key:
      files: [package-lock.json]
    paths: [node_modules]
  before_script:
    - npm ci --no-audit --no-fund
  timeout: 10 minutes

deploy:
  <<: *deploy_template
  script:
    - npm run release
  only:
    - main

